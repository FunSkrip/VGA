{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-center">Анализ и детекция видео</h2>
  <form id="det-form" action="{{ url_for('analysis.upload') }}" method="post" enctype="multipart/form-data"
        class="row g-4 justify-content-center">
    {{ upload_form.hidden_tag() }}
    <div class="col-md-4">
      <label for="modelSelect" class="form-label">Выберите модель YOLOv8</label>
      <select name="model" id="modelSelect" class="form-select" required>
        {% for val, label in models %}
          <option value="{{ val }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label for="fileInput" class="form-label">Загрузите файл</label>
      <input type="file" name="file" id="fileInput" class="form-control"
             accept=".jpg,.jpeg,.png,.gif,.mp4,.avi,.mov" required>
      <small class="text-muted">JPG, PNG, GIF, MP4, AVI, MOV; максимальный размер — 250 МиБ.</small>
    </div>
    <div class="col-md-4 d-flex align-items-end">
      <button type="submit" class="btn btn-success w-100">Запустить детекцию</button>
    </div>
  </form>
  <div id="processing" class="text-center mt-4" style="display: none;">
    <h3>Обрабатывается<span id="dots"></span></h3>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('det-form');
  const processing = document.getElementById('processing');
  const dotsEl = document.getElementById('dots');
  let dots = '';
  form.addEventListener('submit', () => {
    form.style.display = 'none';
    processing.style.display = 'block';
  });
  setInterval(() => {
    dots = dots.length < 3 ? dots + '.' : '';
    dotsEl.textContent = dots;
  }, 500);
</script>
{% endblock %}
