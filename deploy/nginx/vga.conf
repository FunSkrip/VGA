# /etc/nginx/conf.d/vga.conf
# TLS 1.3 is terminated here. Flask listens only on 127.0.0.1:8000.

limit_req_zone $binary_remote_addr zone=vga_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=vga_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=vga_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vga_chatbot:10m rate=30r/m;

server {
    listen 80;
    server_name vga.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vga.example.ru;

    ssl_certificate     /etc/letsencrypt/live/vga.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vga.example.ru/privkey.pem;

    # Lab requirement: TLS 1.3 only.
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 250m;
    client_body_timeout 300s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_request_buffering off;
    proxy_buffering off;

    location = /login {
        limit_req zone=vga_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/vga-proxy-headers.conf;
    }

    location = /register {
        limit_req zone=vga_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/vga-proxy-headers.conf;
    }

    location = /upload {
        limit_req zone=vga_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/vga-proxy-headers.conf;
    }

    location = /chatbot {
        limit_req zone=vga_chatbot burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/vga-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/vga-proxy-headers.conf;
    }

    location ~ /\. {
        deny all;
    }
}
